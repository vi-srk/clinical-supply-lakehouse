[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-supply"
version = "0.1.0"
description = "Governed lakehouse for a pharma clinical-supply chain (synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faker>=24.0",
    "pyyaml>=6.0",
]

[dependency-groups]
# Installed automatically by `uv sync`
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.optional-dependencies]
# Install with: uv sync --extra spark  (needed from Phase 2)
spark = [
    "pyspark>=3.5",
    "delta-spark>=3.2",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["clinical_supply*", "data_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
